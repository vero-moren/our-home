<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>our home — the eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#EDE8F7;
    --dim:rgba(237,232,247,.55);
    --lav:#B9A3FF;
    --lavdim:rgba(185,163,255,.72);
    --press:#6B4FD8;
    --deep:#3A2480;
    --edge:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.055);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{background:#080510;color:var(--text);font-family:'Inter',-apple-system,'PingFang SC',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}

  .wall{position:fixed;inset:0;
    background:url('https://kvegublibjsdyidmsjvy.supabase.co/storage/v1/object/public/chat-media/bg-rooms-purple.png') center/cover no-repeat #080510}
  .shade{position:fixed;inset:0;background:rgba(8,5,16,.5)}

  .hint{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;z-index:2}
  .hint h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;letter-spacing:.08em}
  .hint p{margin-top:10px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:13px;color:rgba(185,163,255,.5)}

  /* theme dots (test only) */
  .dots{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);
    display:flex;gap:12px;z-index:28}
  .dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
  .dot.cur{box-shadow:0 0 8px rgba(185,163,255,.8);border-color:rgba(255,255,255,.6)}
  .d-purple{background:#6B4FD8}.d-lilac{background:#B9A3FF}.d-red{background:#B22439}.d-pink{background:#D98BA0}

  /* ===== the eye ===== */
  .eyeWrap{position:fixed;width:64px;height:64px;z-index:30;touch-action:none;cursor:grab;
    transition:left .38s cubic-bezier(.22,.9,.3,1.18), top .38s cubic-bezier(.22,.9,.3,1.18),
      transform .45s ease, opacity .45s ease}
  .eyeWrap.drag{transition:transform .2s ease, opacity .2s ease;transform:scale(1.1);cursor:grabbing}
  .eyeWrap.idle{transform:scale(.8);opacity:.72}
  .eye{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#000;
    box-shadow:0 0 18px rgba(146,92,255,.5),0 0 42px rgba(107,79,216,.28),inset 0 0 0 1.5px rgba(185,163,255,.45)}
  .eye img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;
    -webkit-user-drag:none}
  .eye .halo{filter:brightness(1.55) saturate(1.15);
    -webkit-mask-image:radial-gradient(ellipse 62% 72% at 50% 50%, #000 28%, transparent 76%);
    mask-image:radial-gradient(ellipse 62% 72% at 50% 50%, #000 28%, transparent 76%);
    opacity:.12;animation:haloB 4.4s ease-in-out infinite}
  .eye .core{filter:brightness(2.15) saturate(1.22);
    -webkit-mask-image:radial-gradient(ellipse 30% 48% at 50% 50%, #000 24%, transparent 70%);
    mask-image:radial-gradient(ellipse 30% 48% at 50% 50%, #000 24%, transparent 70%);
    opacity:.08;animation:coreB 4.4s ease-in-out infinite .12s}
  @keyframes haloB{0%,100%{opacity:.12}50%{opacity:.55}}
  @keyframes coreB{0%,100%{opacity:.08}50%{opacity:1}}
  .eyeWrap.drag .halo{animation-duration:1.5s}
  .eyeWrap.drag .core{animation-duration:1.5s}
  .eyeWrap.idle .halo{animation-duration:7s}
  .eyeWrap.idle .core{animation-duration:7s}
  @media (prefers-reduced-motion: reduce){
    .eye .halo,.eye .core{animation:none;opacity:.3}
  }

  /* ===== the dock (unsheathed bar) ===== */
  .dock{position:fixed;z-index:29;border-radius:22px;
    background:rgba(14,10,26,.5);border:1px solid var(--edge);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:space-around;
    opacity:0;pointer-events:none;
    transition:transform .24s cubic-bezier(.2,.9,.25,1.12), opacity .18s ease}
  .dock.h{width:268px;height:64px;padding:0 8px}
  .dock.v{width:64px;height:268px;flex-direction:column;padding:8px 0}
  .dock.h{transform:scaleX(.08)}
  .dock.v{transform:scaleY(.08)}
  .dock.on{transform:scale(1);opacity:1;pointer-events:auto}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:58px}
  .tab svg{width:21px;height:21px;stroke:var(--lav);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
    transition:transform .15s ease,stroke .15s ease}
  .tab small{display:inline-block;font-size:9px;letter-spacing:.1em;color:var(--lavdim);font-weight:400;
    transition:transform .15s ease,color .15s ease}
  .tab:active svg{stroke:var(--press);transform:scale(1.12)}
  .tab:active small{color:var(--press);transform:scale(1.12);font-weight:500}

  .toast{position:fixed;left:50%;bottom:120px;
    transform:translateX(-50%);padding:9px 18px;border-radius:99px;
    background:rgba(14,10,26,.75);border:1px solid var(--edge);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    font-size:11px;letter-spacing:.08em;color:var(--dim);
    opacity:0;transition:opacity .4s;pointer-events:none;z-index:50;white-space:nowrap}
  .toast.show{opacity:1}
  .mark{position:fixed;bottom:3px;left:50%;transform:translateX(-50%);
    font-size:8px;letter-spacing:.2em;color:rgba(237,232,247,.3);z-index:22}
</style>
</head>
<body>

<div class="wall"></div>
<div class="shade"></div>

<div class="hint">
  <h1>The Eye</h1>
  <p>drag him anywhere — he settles on an edge<br>tap him — the hall unsheathes<br>leave him — he half-closes and waits</p>
</div>

<div class="dots">
  <div class="dot d-purple cur" data-e="purple"></div>
  <div class="dot d-lilac" data-e="lilac"></div>
  <div class="dot d-red" data-e="red"></div>
  <div class="dot d-pink" data-e="pink"></div>
</div>

<div class="dock h" id="dock">
  <div class="tab" data-t="Chat">
    <svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M12 15.4l-3.1-3.1a1.95 1.95 0 0 1 2.76-2.76l.34.34.34-.34a1.95 1.95 0 0 1 2.76 2.76Z"/></svg>
    <small>Chat</small>
  </div>
  <div class="tab" data-t="Moments">
    <svg viewBox="0 0 24 24"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>
    <small>Moments</small>
  </div>
  <div class="tab" data-t="Memory">
    <svg viewBox="0 0 24 24"><path d="M9.94 15.5a2 2 0 0 0-1.44-1.44l-6.13-1.58a.5.5 0 0 1 0-.96l6.13-1.58a2 2 0 0 0 1.44-1.44l1.58-6.13a.5.5 0 0 1 .96 0l1.58 6.13a2 2 0 0 0 1.44 1.44l6.13 1.58a.5.5 0 0 1 0 .96l-6.13 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0Z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
    <small>Memory</small>
  </div>
  <div class="tab" data-t="Settings">
    <svg viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
    <small>Settings</small>
  </div>
</div>

<div class="eyeWrap" id="eyeWrap">
  <div class="eye">
    <img class="base" src="" alt="">
    <img class="halo" src="" alt="">
    <img class="core" src="" alt="">
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="mark">— veye1 ok —</div>

<script>
  var MEDIA = 'https://kvegublibjsdyidmsjvy.supabase.co/storage/v1/object/public/chat-media/';
  var EYES = { purple: 'eye-purple.png', lilac: 'eye-lilac.png', red: 'eye-red.png', pink: 'eye-pink.png' };

  var toast = document.getElementById('toast'), tt;
  function say(m){ toast.textContent = m; toast.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('show'); }, 1600); }

  /* eye theme */
  function setEye(name){
    var u = MEDIA + (EYES[name] || EYES.purple);
    document.querySelectorAll('.eye img').forEach(function(i){ i.src = u; });
    document.querySelectorAll('.dot').forEach(function(d){ d.classList.toggle('cur', d.dataset.e === name); });
  }
  document.querySelectorAll('.dot').forEach(function(d){
    d.addEventListener('click', function(){ setEye(d.dataset.e); });
  });
  setEye(new URLSearchParams(location.search).get('eye') || 'purple');

  /* ===== eye: drag / snap / idle / unsheathe ===== */
  var wrap = document.getElementById('eyeWrap');
  var dock = document.getElementById('dock');
  var SZ = 64, M = 12, GAP = 10;
  var ex = 0, ey = 0, side = 'right', open = false, idleT;

  function place(x, y){ ex = x; ey = y; wrap.style.left = x + 'px'; wrap.style.top = y + 'px'; }
  function vw(){ return window.innerWidth; }
  function vh(){ return window.innerHeight; }

  function wake(){
    wrap.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function(){ if(!open) wrap.classList.add('idle'); }, 5000);
  }

  function snap(){
    var cx = ex + SZ/2, cy = ey + SZ/2;
    var d = [['left', cx], ['right', vw()-cx], ['top', cy], ['bottom', vh()-cy]];
    d.sort(function(a, b){ return a[1] - b[1]; });
    side = d[0][0];
    var x = ex, y = ey;
    if(side === 'left') x = M;
    if(side === 'right') x = vw() - SZ - M;
    if(side === 'top') y = M + 34;
    if(side === 'bottom') y = vh() - SZ - M;
    x = Math.max(M, Math.min(x, vw() - SZ - M));
    y = Math.max(M + 34, Math.min(y, vh() - SZ - M));
    place(x, y);
    wake();
  }

  function unsheathe(){
    var bw = 268, bh = 64, x, y;
    dock.className = 'dock';
    if(side === 'left' || side === 'right'){
      dock.classList.add('h');
      y = Math.max(8, Math.min(ey + SZ/2 - bh/2, vh() - bh - 8));
      if(side === 'left'){ x = ex + SZ + GAP; dock.style.transformOrigin = 'left center'; }
      else { x = ex - GAP - bw; dock.style.transformOrigin = 'right center'; }
    } else {
      dock.classList.add('v');
      x = Math.max(8, Math.min(ex + SZ/2 - 32, vw() - 64 - 8));
      if(side === 'top'){ y = ey + SZ + GAP; dock.style.transformOrigin = 'center top'; }
      else { y = ey - GAP - 268; dock.style.transformOrigin = 'center bottom'; }
    }
    dock.style.left = x + 'px';
    dock.style.top = y + 'px';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ dock.classList.add('on'); }); });
    open = true;
    wrap.classList.remove('idle');
    clearTimeout(idleT);
  }
  function sheathe(){
    dock.classList.remove('on');
    open = false;
    wake();
  }

  var sx, sy, ox, oy, moved = false, dragging = false;
  wrap.addEventListener('pointerdown', function(e){
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY; ox = ex; oy = ey;
    wrap.classList.remove('idle');
    clearTimeout(idleT);
  });
  wrap.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved && Math.abs(dx) + Math.abs(dy) > 8){
      moved = true;
      wrap.classList.add('drag');
      if(open) sheathe();
    }
    if(moved) place(ox + dx, oy + dy);
  });
  wrap.addEventListener('pointerup', function(e){
    if(!dragging) return;
    dragging = false;
    wrap.classList.remove('drag');
    if(moved){ snap(); }
    else { open ? sheathe() : unsheathe(); }
  });
  wrap.addEventListener('pointercancel', function(){
    dragging = false;
    wrap.classList.remove('drag');
    snap();
  });

  /* tap outside sheathes */
  document.addEventListener('pointerdown', function(e){
    if(open && !wrap.contains(e.target) && !dock.contains(e.target)) sheathe();
  });

  /* dock taps */
  document.querySelectorAll('.dock .tab').forEach(function(t){
    t.addEventListener('click', function(){
      say(t.dataset.t + ' — just the mock');
      sheathe();
    });
  });

  window.addEventListener('resize', function(){ if(open) sheathe(); snap(); });

  /* start: right edge, above middle */
  place(vw() - SZ - M, Math.round(vh() * 0.38));
  side = 'right';
  wake();
</script>
</body>
</html>
