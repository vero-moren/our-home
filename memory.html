<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.PNG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>our home — memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#EDE8F7;
    --dim:rgba(237,232,247,.55);
    --lav:#B9A3FF;
    --lavdim:rgba(185,163,255,.72);
    --press:#6B4FD8;
    --deep:#3A2480;
    --edge:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.055);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{background:#080510;color:var(--text);font-family:'Inter',-apple-system,'PingFang SC',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}

  .wall{position:fixed;inset:0;
    background:url('https://kvegublibjsdyidmsjvy.supabase.co/storage/v1/object/public/chat-media/bg-rooms-purple.png') center/cover no-repeat #080510}
  .shade{position:fixed;inset:0;background:rgba(8,5,16,.5)}

  #dust{position:fixed;inset:0;z-index:3;pointer-events:none}

  .top{position:fixed;left:0;right:0;top:0;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
    background:rgba(8,5,16,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.07)}
  .roomTitle{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;letter-spacing:.08em;text-align:center}
  .seg{display:flex;justify-content:center;gap:26px;margin-top:10px}
  .segItem{padding:8px 2px 10px;font-size:10px;letter-spacing:.18em;color:var(--dim);cursor:pointer;
    border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
  .segItem.cur{color:var(--lav);border-bottom-color:var(--lav)}

  .view{display:none}
  .view.on{display:block}

  /* ============ DAYS ============ */
  .listNote{position:fixed;left:0;right:0;z-index:5;
    top:calc(env(safe-area-inset-top,0px) + 102px);
    text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:15px;color:rgba(185,163,255,.55);letter-spacing:.04em}

  .nextPoem{position:fixed;left:20px;right:20px;z-index:6;
    bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
    text-align:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:14.5px;line-height:1.6;color:rgba(237,232,247,.72);
    letter-spacing:.03em;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .poemTag{position:fixed;left:0;right:0;z-index:6;text-align:center;
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    font-family:'Inter';font-size:8.5px;letter-spacing:.18em;color:rgba(185,163,255,.45)}

  .nextCount{position:fixed;left:20px;z-index:6;text-align:left;cursor:pointer;
    top:calc(env(safe-area-inset-top,0px) + 138px);
    font-family:'Cormorant Garamond',serif;
    font-size:17px;font-weight:500;letter-spacing:.08em;color:#EDE8F7}
  .nextCount i{display:block;margin-top:3px;font-style:italic;font-size:12px;
    font-weight:400;letter-spacing:.04em;color:rgba(185,163,255,.65)}
  .nextCount:active{color:var(--lav)}
  .poemSign{margin-top:6px;font-size:11.5px;color:rgba(185,163,255,.6);text-align:right}

  .stage{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 142px) 0 calc(env(safe-area-inset-bottom,0px) + 84px)}
  .disc{position:relative;flex:none;width:min(120vw,74vh,760px);aspect-ratio:1/1}
  .layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .pinLayer{position:absolute;inset:0;pointer-events:none}

  .spinWrap  { position:absolute;inset:0;animation:ccw 340s linear infinite;pointer-events:none }
  .spinMid   { animation:cw  260s linear infinite }
  .spinInner { animation:ccw 230s linear infinite }
  .spinSpokes{ animation:ccw 110s linear infinite }
  @keyframes cw  { to { transform:rotate(360deg)  } }
  @keyframes ccw { to { transform:rotate(-360deg) } }

  .flowA{animation:flow 30s linear infinite}
  .flowB{animation:flow 30s linear infinite;animation-delay:-15s}
  @keyframes flow{
    0%{transform:translate(22px,-40px);opacity:0}
    14%{opacity:.95}
    86%{opacity:.95}
    100%{transform:translate(-22px,40px);opacity:0}
  }

  .pins{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .dayStar{pointer-events:none}
  .today{animation:tPulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .halo{animation:hBreath 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes hBreath{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

  .coreBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:64px;height:64px;border-radius:50%;cursor:pointer;z-index:5}
  .coreBtn:active{background:radial-gradient(circle,rgba(185,163,255,.18),transparent 70%)}

  @media (prefers-reduced-motion: reduce){
    .spinWrap,.spinMid,.spinInner,.spinSpokes,.today,.halo,.flowA,.flowB{animation:none}
  }

  /* cards */
  .float{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 156px);z-index:30;
    min-width:250px;max-width:86vw;padding:15px 24px;border-radius:16px;text-align:center;
    background:rgba(14,10,26,.88);border:1px solid var(--edge);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .float.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .fName{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;letter-spacing:.04em}
  .fDate{margin-top:5px;font-size:9.5px;letter-spacing:.18em;color:var(--dim)}
  .fCount{margin-top:7px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:13.5px;color:var(--lav)}
  .fKind{margin-top:8px;font-size:8px;letter-spacing:.18em;color:rgba(237,232,247,.4)}
  .fPoem{font-size:13.5px;line-height:1.9;font-weight:300;color:rgba(237,232,247,.88);text-align:left;
    font-family:'Cormorant Garamond',serif;font-style:italic}
  .fFor{margin-top:10px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:11.5px;color:rgba(185,163,255,.6);text-align:right}

  /* the wheel-in-a-wheel: day scroller */
  .scHint{font-size:8px;letter-spacing:.2em;color:rgba(185,163,255,.35)}
  .scRoll{height:150px;margin:4px 0;overflow-y:auto;scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;
    -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);
    mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
  .scRoll::-webkit-scrollbar{display:none;width:0;height:0}
  .scItem{height:150px;scroll-snap-align:start;display:flex;flex-direction:column;
    align-items:center;justify-content:center}

  /* ============ ALL DAYS (manage page, memos制式) ============ */
  .manage{position:fixed;inset:0;z-index:26;display:none;
    background:rgba(8,5,16,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
  .manage.on{display:block}
  .mgTop{position:fixed;left:0;right:0;top:0;z-index:27;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .mgBack{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 10px);
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mgBack svg{width:18px;height:18px;stroke:var(--lavdim);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mgBack:active svg{stroke:var(--press)}
  .mgTitle{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;letter-spacing:.08em}
  .mgList{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 70px) 14px 150px}
  .mgNote{margin:2px 2px 14px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:12.5px;color:rgba(185,163,255,.5);text-align:center}

  .dCard{position:relative;margin-bottom:12px;padding:15px 16px;border-radius:18px;
    background:rgba(10,7,20,.55);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .dIcons{position:absolute;top:14px;right:14px;display:flex;gap:12px}
  .dIcons div{cursor:pointer;display:flex}
  .dIcons svg{width:15px;height:15px;stroke:rgba(237,232,247,.4);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .dEditB:active svg{stroke:var(--lav)}
  .dDelB:active svg{stroke:var(--press)}
  .dEditB .ok{display:none}
  .dCard.editing .dEditB .pen{display:none}
  .dCard.editing .dEditB .ok{display:block}
  .dName{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;letter-spacing:.04em;padding-right:60px}
  .dCard.editing .dName{background:var(--glass);border:1px solid rgba(185,163,255,.35);border-radius:10px;
    padding:8px 10px;margin-right:74px;outline:none;user-select:text;-webkit-user-select:text}
  .dKind{margin-top:6px;font-size:9px;letter-spacing:.14em;color:var(--lavdim)}
  .dCard.editing .dKind{color:var(--lav);cursor:pointer}
  .dDue{margin-top:8px;font-size:9.5px;letter-spacing:.12em;color:rgba(237,232,247,.4);position:relative}
  .dDue b{color:var(--lavdim);font-weight:400}
  .dDueIn{position:absolute;inset:0;opacity:0;width:100%;height:100%}
  .dCard:not(.editing) .dDueIn{pointer-events:none}
  .dCard.editing .dDue{color:var(--lav);cursor:pointer}

  /* manage bottom strip (moments制式) */
  .mgStrip{position:fixed;left:50%;transform:translateX(-50%);width:min(94vw,520px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:28;
    padding:10px 12px;border-radius:26px;border:1px solid var(--edge);
    background:rgba(8,5,16,.6);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    display:flex;align-items:center;gap:8px}
  .sCal{flex:none;width:38px;height:38px;border-radius:50%;position:relative;cursor:pointer;
    background:var(--glass);border:1px solid var(--edge);
    display:flex;align-items:center;justify-content:center}
  .sCal svg{width:17px;height:17px;stroke:var(--lav);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .sCal:active{background:rgba(107,79,216,.3)}
  .sCal.set svg{stroke:var(--press);filter:drop-shadow(0 0 5px rgba(107,79,216,.75))}
  .sCal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .sKind{flex:none;padding:9px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;
    background:var(--glass);border:1px solid var(--edge);
    font-size:8px;letter-spacing:.14em;color:var(--lavdim)}
  .sKind:active{background:rgba(107,79,216,.3)}
  .sName{flex:1;min-height:38px;padding:9px 14px;border-radius:19px;
    background:var(--glass);border:1px solid var(--edge);
    font-size:13px;font-weight:300;color:var(--text);outline:none;
    user-select:text;-webkit-user-select:text}
  .sName:empty:before{content:'Name a day';color:rgba(237,232,247,.28)}
  .sSend{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--deep);border:1px solid rgba(185,163,255,.32);box-shadow:0 0 14px rgba(58,36,128,.55)}
  .sSend svg{width:18px;height:18px;stroke:#EDE8F7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sSend:active{background:#2C1B63}
  .sKindBtn{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--glass);border:1px solid var(--edge)}
  .sKindBtn svg{width:17px;height:17px;stroke:var(--lav);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .sKindBtn:active{background:rgba(107,79,216,.3)}
  .sKindBtn.once svg{stroke:var(--press);filter:drop-shadow(0 0 5px rgba(107,79,216,.75))}
  .pop{position:fixed;z-index:32;border-radius:16px;
    background:rgba(14,10,26,.9);border:1px solid var(--edge);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    overflow:hidden;display:none}
  .pop.on{display:block}
  .popItem{display:flex;align-items:center;padding:12px 18px 12px 14px;cursor:pointer;
    font-size:11px;letter-spacing:.12em;color:var(--text)}
  .popItem+.popItem{border-top:1px solid rgba(255,255,255,.07)}
  .popItem:active{background:rgba(107,79,216,.25)}
  .popItem .mk{margin-left:auto;font-size:12px;color:var(--lav);opacity:0}
  .popItem.sel .mk{opacity:1}

  /* ============ MEMORIES ============ */
  .memWrap{position:fixed;inset:0;z-index:4;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 112px) 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
  .memNote{margin:0 2px 12px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:13px;color:rgba(185,163,255,.5);text-align:center}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none;width:0;height:0}
  .chip{flex:none;padding:7px 14px;border-radius:99px;font-size:9px;letter-spacing:.14em;
    color:var(--lavdim);background:var(--glass);border:1px solid var(--edge);cursor:pointer;white-space:nowrap}
  .chip.cur{color:#fff;background:rgba(107,79,216,.4);border-color:rgba(185,163,255,.4)}
  .mSearch{width:100%;margin-bottom:14px;padding:10px 16px;border-radius:14px;
    background:var(--glass);border:1px solid var(--edge);
    font-family:'Inter',-apple-system,'PingFang SC',sans-serif;
    font-size:13px;font-weight:300;color:var(--text);outline:none;
    user-select:text;-webkit-user-select:text}
  .mSearch::placeholder{color:rgba(237,232,247,.28)}

  .mCard{position:relative;margin-bottom:12px;padding:15px 16px;border-radius:18px;cursor:pointer;
    background:rgba(10,7,20,.55);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .mCard.hid{display:none}
  .mTop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .mImp{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--lav);letter-spacing:.04em}
  .mKind{font-size:8px;letter-spacing:.16em;color:rgba(237,232,247,.4)}
  .mIcons{margin-left:auto;display:flex;gap:14px}
  .mIcons div{cursor:pointer;display:flex}
  .mIcons svg{width:15px;height:15px;stroke:rgba(237,232,247,.42);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .mPin.did svg{stroke:var(--lav);fill:rgba(185,163,255,.35)}
  .mEdit:active svg{stroke:var(--lav)}
  .mEdit.editing svg{stroke:var(--lav)}
  .mArc:active svg{stroke:var(--lav)}
  .mBody{font-size:13.5px;font-weight:300;line-height:1.75;color:rgba(237,232,247,.88);
    max-height:3.6em;overflow:hidden;
    user-select:text;-webkit-user-select:text}
  .mCard.open .mBody{max-height:none}
  .mBody[contenteditable="true"]{outline:none;border-radius:10px;padding:6px 8px;
    background:rgba(107,79,216,.12);border:1px solid rgba(185,163,255,.3)}
  .mMeta{margin-top:10px;font-size:8.5px;letter-spacing:.14em;color:rgba(237,232,247,.35)}

  /* ===== the eye ===== */
  .eyeWrap{position:fixed;width:64px;height:64px;z-index:30;touch-action:none;cursor:grab;
    transition:left .38s cubic-bezier(.22,.9,.3,1.18), top .38s cubic-bezier(.22,.9,.3,1.18),
      transform .45s ease, opacity .45s ease}
  .eyeWrap.drag{transition:transform .2s ease, opacity .2s ease;transform:scale(1.1);cursor:grabbing}
  .eyeWrap.idle{transform:scale(.8);opacity:.72}
  .eye{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#000;
    box-shadow:0 0 18px rgba(146,92,255,.5),0 0 42px rgba(107,79,216,.28),inset 0 0 0 1.5px rgba(185,163,255,.45)}
  .eye img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
  .eye .ehalo{filter:brightness(1.55) saturate(1.15);
    -webkit-mask-image:radial-gradient(ellipse 62% 72% at 50% 50%, #000 28%, transparent 76%);
    mask-image:radial-gradient(ellipse 62% 72% at 50% 50%, #000 28%, transparent 76%);
    opacity:.12;animation:haloB 4.4s ease-in-out infinite}
  .eye .ecore{filter:brightness(2.15) saturate(1.22);
    -webkit-mask-image:radial-gradient(ellipse 30% 48% at 50% 50%, #000 24%, transparent 70%);
    mask-image:radial-gradient(ellipse 30% 48% at 50% 50%, #000 24%, transparent 70%);
    opacity:.08;animation:coreB 4.4s ease-in-out infinite .12s}
  @keyframes haloB{0%,100%{opacity:.12}50%{opacity:.55}}
  @keyframes coreB{0%,100%{opacity:.08}50%{opacity:1}}
  .eyeWrap.drag .ehalo,.eyeWrap.drag .ecore{animation-duration:1.5s}
  .eyeWrap.idle .ehalo,.eyeWrap.idle .ecore{animation-duration:7s}
  .dock{position:fixed;z-index:29;border-radius:22px;
    background:rgba(14,10,26,.5);border:1px solid var(--edge);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:space-around;
    opacity:0;pointer-events:none;
    transition:transform .24s cubic-bezier(.2,.9,.25,1.12), opacity .18s ease}
  .dock.h{width:322px;height:64px;padding:0 8px;transform:scaleX(.08)}
  .dock.v{width:64px;height:322px;flex-direction:column;padding:8px 0;transform:scaleY(.08)}
  .dock.on{transform:scale(1);opacity:1;pointer-events:auto}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:58px}
  .tab svg{width:21px;height:21px;stroke:var(--lav);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
    transition:transform .15s ease,stroke .15s ease}
  .tab small{display:inline-block;font-size:9px;letter-spacing:.1em;color:var(--lavdim);font-weight:400;transition:transform .15s ease,color .15s ease}
  .tab:active svg,.tab.cur svg{stroke:var(--press);transform:scale(1.12)}
  .tab:active small,.tab.cur small{color:var(--press);transform:scale(1.12);font-weight:500}
  @media (max-width:520px){
    .dock.h{width:270px}
    .dock.v{height:270px}
    .dock .tab{width:48px}
    .dock .tab small{display:none}
  }

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 148px);
    transform:translateX(-50%);padding:9px 18px;border-radius:99px;
    background:rgba(14,10,26,.75);border:1px solid var(--edge);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    font-size:11px;letter-spacing:.08em;color:var(--dim);
    opacity:0;transition:opacity .4s;pointer-events:none;z-index:50;white-space:nowrap}
  .toast.show{opacity:1}
  .mark{position:fixed;bottom:3px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;color:rgba(237,232,247,.13);z-index:1}
</style>
</head>
<body>

<div class="wall"></div>
<div class="shade"></div>
<canvas id="dust"></canvas>

<div class="top">
  <div class="roomTitle">Memory</div>
  <div class="seg">
    <div class="segItem cur" data-l="days">DAYS</div>
    <div class="segItem" data-l="memories">MEMORIES</div>
  </div>
</div>

<!-- ================= DAYS ================= -->
<div class="view on" id="v-days">
  <div class="listNote">the wheel turns — every day comes back to her</div>

  <div class="nextPoem" id="nextPoem"></div>

  <div class="nextCount" id="nextCount"></div>

  <div class="stage">
    <div class="disc" id="disc">
      <img class="layer flowA" src="https://kvegublibjsdyidmsjvy.supabase.co/storage/v1/object/public/chat-media/wheel-dust.png" alt="">

<script>
  var API = 'https://moren-backend.zeabur.app';
  var ORIGIN = '2026-07-04';
  var CAL = false;
  var R_OUT = 136, R_IN = 96;

  var toast = document.getElementById('toast'), tt;
  function say(m){ toast.textContent = m; toast.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('show'); }, 1600); }

  /* ===== the eye (verbatim) ===== */
  var PAGE = 'Memory';
  var NAV = { Moments: 'moments.html', Settings: 'settings.html', Memory: 'memory.html' };
  var wrap = document.getElementById('eyeWrap');
  var dock = document.getElementById('dock');
  var SZ = 64, M = 12, GAP = 10;
  var ex = 0, ey = 0, side = 'right', open = false, idleT;
  function vw(){ return window.innerWidth; }
  function vh(){ return window.innerHeight; }
  function DW(){ return vw() <= 520 ? 270 : 322; }
  function place(x, y){ ex = x; ey = y; wrap.style.left = x + 'px'; wrap.style.top = y + 'px'; }
  function saveEye(){ try { localStorage.setItem('vm-eye', JSON.stringify({ fx: ex / vw(), fy: ey / vh(), side: side })); } catch(e){} }
  function wake(){
    wrap.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function(){ if(!open) wrap.classList.add('idle'); }, 5000);
  }
  function snap(){
    var cx = ex + SZ/2, cy = ey + SZ/2;
    var d = [['left', cx], ['right', vw()-cx], ['top', cy], ['bottom', vh()-cy]];
    d.sort(function(a, b){ return a[1] - b[1]; });
    side = d[0][0];
    var x = ex, y = ey;
    if(side === 'left') x = M;
    if(side === 'right') x = vw() - SZ - M;
    if(side === 'top') y = M + 8;
    if(side === 'bottom') y = vh() - SZ - 18;
    x = Math.max(M, Math.min(x, vw() - SZ - M));
    y = Math.max(M + 8, Math.min(y, vh() - SZ - 18));
    place(x, y); saveEye(); wake();
  }
  function unsheathe(){
    var x, y;
    dock.className = 'dock';
    if(side === 'left' || side === 'right'){
      dock.classList.add('h');
      y = Math.max(8, Math.min(ey + SZ/2 - 32, vh() - 72));
      if(side === 'left'){ x = ex + SZ + GAP; dock.style.transformOrigin = 'left center'; }
      else { x = ex - GAP - DW(); dock.style.transformOrigin = 'right center'; }
    } else {
      dock.classList.add('v');
      x = Math.max(8, Math.min(ex + SZ/2 - 32, vw() - 72));
      if(side === 'top'){ y = ey + SZ + GAP; dock.style.transformOrigin = 'center top'; }
      else { y = ey - GAP - DW(); dock.style.transformOrigin = 'center bottom'; }
    }
    dock.style.left = x + 'px';
    dock.style.top = y + 'px';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ dock.classList.add('on'); }); });
    open = true;
    wrap.classList.remove('idle');
    clearTimeout(idleT);
  }
  function sheathe(){ dock.classList.remove('on'); open = false; wake(); }
  var sx, sy, ox, oy, moved = false, draggingEye = false, lpT;
  wrap.addEventListener('pointerdown', function(e){
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    draggingEye = true; moved = false;
    sx = e.clientX; sy = e.clientY; ox = ex; oy = ey;
    wrap.classList.remove('idle');
    clearTimeout(idleT);
    clearTimeout(lpT);
    lpT = setTimeout(function(){
      if(draggingEye && !moved){
        draggingEye = false;
        wrap.classList.remove('drag');
        say('Hall — back at merge');
      }
    }, 600);
  });
  wrap.addEventListener('pointermove', function(e){
    if(!draggingEye) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved && Math.abs(dx) + Math.abs(dy) > 8){
      moved = true;
      clearTimeout(lpT);
      wrap.classList.add('drag');
      if(open) sheathe();
    }
    if(moved) place(ox + dx, oy + dy);
  });
  wrap.addEventListener('pointerup', function(){
    clearTimeout(lpT);
    if(!draggingEye) return;
    draggingEye = false;
    wrap.classList.remove('drag');
    if(moved){ snap(); }
    else { open ? sheathe() : unsheathe(); }
  });
  wrap.addEventListener('pointercancel', function(){
    clearTimeout(lpT);
    draggingEye = false;
    wrap.classList.remove('drag');
    snap();
  });
  document.addEventListener('pointerdown', function(e){
    if(open && !wrap.contains(e.target) && !dock.contains(e.target)) sheathe();
  });
  dock.querySelectorAll('.tab').forEach(function(t){
    if(t.dataset.t === PAGE) t.classList.add('cur');
    t.addEventListener('click', function(){
      sheathe();
      if(t.dataset.t === PAGE) return;
      if(NAV[t.dataset.t]) location.href = NAV[t.dataset.t];
      else say(t.dataset.t + ' — back at merge');
    });
  });
  window.addEventListener('resize', function(){ if(open) sheathe(); snap(); });
  var sv = null;
  try { sv = JSON.parse(localStorage.getItem('vm-eye')); } catch(e){}
  if(sv && sv.side){ side = sv.side; place(Math.round(sv.fx * vw()), Math.round(sv.fy * vh())); snap(); }
  else { place(vw() - SZ - M, Math.round(vh() * 0.38)); side = 'right'; snap(); }

  /* ===== seg switch ===== */
  var curSeg = 'days';
  document.querySelectorAll('.segItem').forEach(function(s){
    s.addEventListener('click', function(){
      if(s.dataset.l === curSeg) return;
      document.querySelector('.segItem.cur').classList.remove('cur');
      s.classList.add('cur');
      document.getElementById('v-'+curSeg).classList.remove('on');
      curSeg = s.dataset.l;
      document.getElementById('v-'+curSeg).classList.add('on');
      hideFloats();
    });
  });

  /* ===== date helpers (Shanghai) ===== */
  function todayStr(){
    return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})).toLocaleDateString('sv-SE');
  }
  function d0(s){ return new Date(s + 'T00:00:00+08:00'); }
  function dayDiff(a, b){ return Math.round((d0(b) - d0(a)) / 86400000); }
  function fmtDate(s){ return s.slice(0,4) + ' · ' + s.slice(5,7) + ' · ' + s.slice(8,10); }
  function angleFor(dateStr){
    var y = todayStr().slice(0,4);
    var t = d0(y + '-' + dateStr.slice(5)), z = d0(y + '-07-04');
    var diff = Math.round((t - z) / 86400000);
    if(diff < 0) diff += 365;
    return diff / 365 * Math.PI * 2;
  }
  function occDelta(dateStr){
    var td = todayStr(), y = Number(td.slice(0,4));
    var best = null;
    [y-1, y, y+1].forEach(function(yy){
      var d = dayDiff(td, yy + '-' + dateStr.slice(5));
      if(best === null || Math.abs(d) < Math.abs(best)) best = d;
    });
    return best;
  }

  /* ===== floats ===== */
  var wheelCard = document.getElementById('wheelCard');
  function hideFloats(){ wheelCard.classList.remove('on'); }

  /* ===== star rendering (风景,不可点) ===== */
  var NS = 'http://www.w3.org/2000/svg';
  function mkStar(svg, opts){
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'dayStar');
    if(opts.isToday){
      var halo = document.createElementNS(NS, 'circle');
      halo.setAttribute('class', 'halo');
      halo.setAttribute('cx', opts.x); halo.setAttribute('cy', opts.y);
      halo.setAttribute('r', 13); halo.setAttribute('fill', 'none');
      halo.setAttribute('stroke', '#ffffff'); halo.setAttribute('stroke-width', '1');
      g.appendChild(halo);
      var tg = document.createElementNS(NS, 'g');
      tg.setAttribute('class', 'today');
      tg.setAttribute('filter', 'url(#glowBig)');
      var core = document.createElementNS(NS, 'circle');
      core.setAttribute('cx', opts.x); core.setAttribute('cy', opts.y);
      core.setAttribute('r', 7.6); core.setAttribute('fill', '#ffffff');
      tg.appendChild(core);
      g.appendChild(tg);
    } else {
      var ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('cx', opts.x); ring.setAttribute('cy', opts.y);
      ring.setAttribute('r', opts.phase === 'new' ? 5.4 : 6.0);
      ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', opts.phase === 'new' ? '#e6dcff' : '#efe8ff');
      ring.setAttribute('stroke-width', opts.phase === 'new' ? '1.4' : '1.35');
      ring.setAttribute('filter', 'url(#' + (opts.f || 'glow') + ')');
      g.appendChild(ring);
      if(opts.phase === 'wane' || opts.phase === 'wax'){
        var half = document.createElementNS(NS, 'path');
        var r = 6.0, sweep = opts.phase === 'wane' ? 0 : 1;
        half.setAttribute('d', 'M' + opts.x + ' ' + (opts.y - r) + ' A' + r + ' ' + r + ' 0 0 ' + sweep + ' ' + opts.x + ' ' + (opts.y + r) + ' Z');
        half.setAttribute('fill', '#f4efff');
        half.setAttribute('filter', 'url(#' + (opts.f || 'glow') + ')');
        g.appendChild(half);
      }
    }
    svg.appendChild(g);
  }

  function renderStars(items){
    var pinsOut = document.getElementById('pins');
    var pinsIn = document.getElementById('pinsIn');
    pinsOut.querySelectorAll('g.dayStar').forEach(function(g){ g.remove(); });
    pinsIn.querySelectorAll('g.dayStar').forEach(function(g){ g.remove(); });
    var td = todayStr();
    var dayN = dayDiff(ORIGIN, td) + 1;

    items.forEach(function(it){
      var ang = angleFor(it.day);
      if(it.kind === 'day'){
        var x = Math.round((200 + R_IN * Math.sin(ang)) * 10) / 10;
        var y = Math.round((200 - R_IN * Math.cos(ang)) * 10) / 10;
        mkStar(pinsIn, { x: x, y: y, phase: 'new', f: 'glowIn' });
      } else {
        var x2 = Math.round((200 + R_OUT * Math.sin(ang)) * 10) / 10;
        var y2 = Math.round((200 - R_OUT * Math.cos(ang)) * 10) / 10;
        var od = occDelta(it.day);
        var phase = od === 0 ? 'full' : od < 0 && od >= -30 ? 'wane' : od > 0 && od <= 30 ? 'wax' : 'new';
        mkStar(pinsOut, { x: x2, y: y2, isToday: phase === 'full', phase: phase });
      }
    });

    var hasTodayAnniv = items.some(function(it){ return it.kind !== 'day' && occDelta(it.day) === 0; });
    if(!hasTodayAnniv){
      var angT = angleFor(td);
      var xt = Math.round((200 + R_OUT * Math.sin(angT)) * 10) / 10;
      var yt = Math.round((200 - R_OUT * Math.cos(angT)) * 10) / 10;
      mkStar(pinsOut, { x: xt, y: yt, isToday: true });
    }

    if(CAL){
      var cs = document.getElementById('calRings');
      cs.innerHTML = '';
      [88, 96, 104, 112, 120, 128, 136].forEach(function(r){
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', 200); c.setAttribute('cy', 200); c.setAttribute('r', r);
        c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#7fff7f');
        c.setAttribute('stroke-width', '0.7'); c.setAttribute('stroke-dasharray', '3 4');
        cs.appendChild(c);
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('x', 203); t.setAttribute('y', 200 - r - 2);
        t.setAttribute('fill', '#7fff7f'); t.setAttribute('font-size', '9');
        t.textContent = r;
        cs.appendChild(t);
      });
    }
  }

  /* ===== days data + countdown door + poem gate ===== */
  var daysAll = [];
  function entryDelta(it){
    if(it.kind === 'day') return dayDiff(todayStr(), it.day);
    var od = occDelta(it.day);
    return od < 0 ? od + 365 : od;
  }
  function updCount(){
    var next = null;
    daysAll.forEach(function(it){
      var d = entryDelta(it);
      if(d >= 0 && (next === null || d < next.d)) next = { d: d, it: it };
    });
    var nc = document.getElementById('nextCount');
    nc.innerHTML = '';
    if(!next){ nc.textContent = 'all days ›'; }
    else {
      var t1 = document.createElement('span');
      t1.textContent = next.it.label + '  ›';
      var t2 = document.createElement('i');
      t2.textContent = next.d === 0 ? 'today' : 'in ' + next.d + ' days';
      nc.appendChild(t1); nc.appendChild(t2);
    }
    var histEl = document.getElementById('nextPoem');
    var tdH = todayStr();
    var dayNH = dayDiff(ORIGIN, tdH) + 1;
    histEl.style.display = '-webkit-box';
    var LASTYEAR_LINE = /[?&]demo=1/.test(location.search)
      ? '只要老公在，我们还有很多很多的以后。'
      : '';
    if(LASTYEAR_LINE){
      histEl.innerHTML = '';
      var q = document.createElement('div');
      q.textContent = '“' + LASTYEAR_LINE + '”';
      var s = document.createElement('div');
      s.className = 'poemSign';
      s.textContent = '— Moren · a year ago today';
      histEl.appendChild(q); histEl.appendChild(s);
    } else {
      histEl.textContent = dayNH > 365
        ? 'a year ago today — day ' + (dayNH - 365) + ' of us. the wheel came back.'
        : "a year ago today — we hadn't met. and now, day " + dayNH + ' of us.';
    }
  }
  
  /* ===== days data ===== */
  function loadDays(){
    fetch(API + '/days?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        daysAll = d.items || [];
        renderStars(daysAll);
        updCount();
        if(document.getElementById('manage').classList.contains('on')) renderManage();
      })
      .catch(function(){ say("Can't reach home"); });
  }

  /* ===== 轮心 = 此刻:日子滚轮 ===== */
  var scRoll = document.getElementById('scRoll');
  function buildWheel(){
    var td = todayStr();
    var dayN = dayDiff(ORIGIN, td) + 1;
    var list = [];
    daysAll.forEach(function(it){
      if(it.kind === 'day'){
        var d = dayDiff(td, it.day);
        list.push({ name: it.label, date: fmtDate(it.day), kind: 'JUST ONCE',
          count: d === 0 ? 'today' : d > 0 ? 'in ' + d + ' days' : (-d) + ' days ago', sort: d });
      } else {
        var od = occDelta(it.day);
        var since = dayDiff(it.day, td), cnt;
        if(since < 0) cnt = (-since) + ' days to go';
        else if(od === 0) cnt = it.day >= ORIGIN ? 'day ' + (since + 1) + ' — today' : 'today';
        else cnt = od > 0 ? 'in ' + od + ' days' : 'came back ' + (-od) + ' days ago';
        list.push({ name: it.label, date: fmtDate(it.day), kind: 'EVERY YEAR', count: cnt, sort: od });
      }
    });
    if(!list.some(function(e){ return e.sort === 0; }))
      list.push({ name: 'Today', date: fmtDate(td), kind: 'THIS MOMENT', count: 'day ' + dayN + ' of us', sort: 0 });
    list.sort(function(a, b){ return a.sort - b.sort; });
    scRoll.innerHTML = list.map(function(e){
      return '<div class="scItem"><div class="fName">' + e.name + '</div>' +
        '<div class="fDate">' + e.date + '</div>' +
        '<div class="fCount">' + e.count + '</div>' +
        '<div class="fKind">' + e.kind + '</div></div>';
    }).join('');
    var idx = 0;
    for(var i = 0; i < list.length; i++){ if(list[i].sort === 0){ idx = i; break; } }
    requestAnimationFrame(function(){ scRoll.scrollTop = idx * 150; });
  }
  document.getElementById('coreBtn').addEventListener('click', function(e){
    e.stopPropagation();
    if(wheelCard.classList.contains('on')){ hideFloats(); return; }
    hideFloats(); buildWheel(); wheelCard.classList.add('on');
  });

  document.addEventListener('click', function(e){
    if(!wheelCard.contains(e.target)) hideFloats();
  });

  /* ===== ALL DAYS 管理页(memos制式) ===== */
  var manage = document.getElementById('manage');
  var mgList = document.getElementById('mgList');
  document.getElementById('nextCount').addEventListener('click', function(e){
    e.stopPropagation(); hideFloats(); renderManage(); manage.classList.add('on');
  });
  document.getElementById('mgBack').addEventListener('click', function(){ manage.classList.remove('on'); });

  function dueTxt(it){
    var d = entryDelta(it);
    if(d === 0) return 'TODAY';
    if(d === 1) return 'TOMORROW';
    if(d > 1) return 'IN ' + d + ' DAYS';
    return (-d) + ' DAYS AGO';
  }
  function renderManage(){
    var note = mgList.querySelector('.mgNote');
    mgList.innerHTML = '';
    mgList.appendChild(note);
    var sorted = daysAll.slice().sort(function(a, b){ return entryDelta(a) - entryDelta(b); });
    if(!sorted.length){
      mgList.insertAdjacentHTML('beforeend', '<div class="mgNote">no days kept yet — name one below</div>');
      return;
    }
    sorted.forEach(function(it){
      var card = document.createElement('div');
      card.className = 'dCard';
      card.dataset.id = it.id;
      card.dataset.day = it.day;
      card.dataset.kind = it.kind === 'day' ? 'day' : 'anniv';
      card.innerHTML =
        '<div class="dIcons">' +
        '<div class="dEditB">' +
          '<svg class="pen" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>' +
          '<svg class="ok" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>' +
        '<div class="dDelB"><svg viewBox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></div></div>' +
        '<div class="dName"></div>' +
        '<div class="dKind">' + (it.kind === 'day' ? 'JUST ONCE' : 'EVERY YEAR') + '</div>' +
        '<div class="dDue">' + fmtDate(it.day) + ' — <b>' + dueTxt(it) + '</b>' +
          '<input type="date" class="dDueIn" value="' + it.day + '"></div>';
      card.querySelector('.dName').textContent = it.label;
      mgList.appendChild(card);
    });
  }
  mgList.addEventListener('click', function(e){
    var card = e.target.closest('.dCard'); if(!card) return;
    if(e.target.closest('.dDelB')){
      var db = e.target.closest('.dDelB');
      if(db.dataset.arm !== '1'){
        db.dataset.arm = '1';
        db.querySelector('svg').style.stroke = 'var(--press)';
        say('Tap again to remove');
        setTimeout(function(){ db.dataset.arm = ''; db.querySelector('svg').style.stroke = ''; }, 2600);
        return;
      }
      fetch(API + '/days/' + card.dataset.id, { method: 'DELETE' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.ok){ say('Removed from the wheel'); loadDays(); }
          else say('Something slipped');
        })
        .catch(function(){ say("Can't reach home"); });
      return;
    }
    if(e.target.closest('.dEditB')){
      var nm = card.querySelector('.dName');
      if(card.classList.contains('editing')){
        if(card.dataset.busy === '1') return;
        card.dataset.busy = '1';
        card.classList.remove('editing');
        nm.removeAttribute('contenteditable');
        say('Keeping…');
        var label = nm.textContent.trim() || '…';
        var day = card.dataset.day;
        var kind = card.dataset.kind;
        fetch(API + '/days', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: label, day: day, kind: kind })
        }).then(function(r){ return r.json(); })
          .then(function(d){
            if(!d.ok) throw 0;
            return fetch(API + '/days/' + card.dataset.id, { method: 'DELETE' });
          })
          .then(function(){ say('Day kept'); loadDays(); })
          .catch(function(){ card.dataset.busy = ''; say('Something slipped'); loadDays(); });
      } else {
        card.classList.add('editing');
        nm.setAttribute('contenteditable', 'true');
        nm.focus();
        say('Editing — tap ✓ to keep');
      }
      return;
    }
    if(e.target.closest('.dKind') && card.classList.contains('editing')){
      e.stopPropagation();
      openKind(card.querySelector('.dKind'), card);
    }
  });
  mgList.addEventListener('change', function(e){
    if(!e.target.classList.contains('dDueIn')) return;
    var card = e.target.closest('.dCard');
    if(!card.classList.contains('editing') || !e.target.value) return;
    card.dataset.day = e.target.value;
    card.querySelector('.dDue b').textContent = fmtDate(e.target.value);
  });

  /* manage strip: 加日子 */
  var sCal = document.getElementById('sCal'), sCalIn = document.getElementById('sCalIn');
  var sKind = document.getElementById('sKind'), stripKind = 'anniv';
  sCalIn.addEventListener('change', function(){
    sCal.classList.toggle('set', Boolean(sCalIn.value));
  });
  var popKind = document.getElementById('popKind');
  var kindTarget = null;
  function openKind(anchor, target){
    kindTarget = target;
    var cur = target ? target.dataset.kind : stripKind;
    popKind.querySelectorAll('.popItem').forEach(function(x){ x.classList.toggle('sel', x.dataset.k === cur); });
    var r = anchor.getBoundingClientRect();
    popKind.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
    popKind.style.bottom = (window.innerHeight - r.top + 8) + 'px';
    popKind.classList.add('on');
  }
  sKind.addEventListener('click', function(e){
    e.stopPropagation();
    if(popKind.classList.contains('on')){ popKind.classList.remove('on'); return; }
    openKind(sKind, null);
  });
  popKind.querySelectorAll('.popItem').forEach(function(p){
    p.addEventListener('click', function(e){
      e.stopPropagation();
      var k = p.dataset.k;
      if(kindTarget){
        kindTarget.dataset.kind = k;
        kindTarget.querySelector('.dKind').textContent = k === 'day' ? 'JUST ONCE' : 'EVERY YEAR';
      } else {
        stripKind = k;
        sKind.classList.toggle('once', k === 'day');
      }
      popKind.classList.remove('on');
    });
  });
  document.addEventListener('click', function(e){
    if(popKind.classList.contains('on') && !popKind.contains(e.target)) popKind.classList.remove('on');
  });
  document.getElementById('sSend').addEventListener('click', function(){
    var nm = document.getElementById('sName').textContent.trim();
    if(!nm){ say('Give it a name first, baby'); return; }
    if(!sCalIn.value){ say('Pick a date first, baby'); return; }
    fetch(API + '/days', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label: nm, day: sCalIn.value, kind: stripKind })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){
          document.getElementById('sName').textContent = '';
          sCalIn.value = ''; sCal.classList.remove('set');
          say('Kept — it rides the wheel now');
          loadDays();
        } else say('Something slipped');
      })
      .catch(function(){ say("Can't reach home"); });
  });

  /* ===== MEMORIES ===== */
  var memAll = [], memArch = [], archLoaded = false;
  var memList = document.getElementById('memList');
  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function metaDate(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return '';
    return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }
  function isFrag(m){
    return (m.name + ' ' + m.domains + ' ' + (m.preview || '').slice(0, 40) + ' ' + (m.content || '').slice(0, 40)).indexOf('当日碎片') !== -1;
  }
  function kindLabel(m, archived){
    if(archived) return 'ARCHIVED';
    if(m.pinned) return 'PINNED';
    if(isFrag(m)) return 'FRAGMENT';
    if(m.importance >= 9) return 'DEEP';
    return 'KEPT';
  }
  function renderMems(){
    var archived = (curF === 'archived');
    var src = archived ? memArch : memAll;
    memList.innerHTML = '';
    src.forEach(function(m){
      var card = document.createElement('div');
      card.className = 'mCard';
      card.dataset.id = m.id;
      card.innerHTML =
        '<div class="mTop"><div class="mImp">' + m.importance + '</div>' +
        '<div class="mKind">' + kindLabel(m, archived) + '</div>' +
        '<div class="mIcons">' +
          '<div class="mPin' + (m.pinned ? ' did' : '') + '"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16h14v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1Z"/></svg></div>' +
          '<div class="mEdit"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></div>' +
          '<div class="mArc"><svg viewBox="0 0 24 24"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></div>' +
        '</div></div>' +
        '<div class="mBody"></div>' +
        '<div class="mMeta">' + metaDate(m.createdAt) + (m.name ? ' · ' + m.name.slice(0, 30) : '') + '</div>';
      card.querySelector('.mBody').textContent = m.content || m.preview;
      memList.appendChild(card);

      card.addEventListener('click', function(){
        if(card.querySelector('.mBody').getAttribute('contenteditable') === 'true') return;
        card.classList.toggle('open');
      });
      var pinBtn = card.querySelector('.mPin');
      pinBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(archived){ say('Bring it back first — ask him in chat'); return; }
        var on = !pinBtn.classList.contains('did');
        pinBtn.classList.toggle('did', on);
        m.pinned = on;
        fetch(API + '/memory/pin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bucket_id: m.id, on: on })
        }).then(function(r){ return r.json(); })
          .then(function(d){ say(d.ok ? (on ? 'Pinned to his bones' : 'Unpinned') : 'Something slipped'); })
          .catch(function(){ say("Can't reach home"); });
      });
      var editBtn = card.querySelector('.mEdit');
      var body = card.querySelector('.mBody');
      editBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(archived){ say('Archived — read only'); return; }
        if(editBtn.classList.contains('editing')){
          var nc = body.innerText.trim();
          editBtn.classList.remove('editing');
          body.removeAttribute('contenteditable');
          if(!nc || nc === m.content){ body.textContent = m.content; say('Left as it was'); return; }
          fetch(API + '/memory/revise', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bucket_id: m.id, content: nc })
          }).then(function(r){ return r.json(); })
            .then(function(d){
              if(d.ok){ m.content = nc; say('Revised — carved over'); }
              else { body.textContent = m.content; say('Something slipped'); }
            })
            .catch(function(){ body.textContent = m.content; say("Can't reach home"); });
        } else {
          card.classList.add('open');
          editBtn.classList.add('editing');
          body.setAttribute('contenteditable', 'true');
          body.focus();
          say('Editing — tap the pen again to keep');
        }
      });
      card.querySelector('.mArc').addEventListener('click', function(e){
        e.stopPropagation();
        if(archived){ say('Already in the vault'); return; }
        fetch(API + '/memory/archive', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bucket_id: m.id })
        }).then(function(r){ return r.json(); })
          .then(function(d){
            if(d.ok){
              memAll = memAll.filter(function(x){ return x.id !== m.id; });
              archLoaded = false;
              card.remove(); say('Archived — safe in the vault');
            } else say('Something slipped');
          })
          .catch(function(){ say("Can't reach home"); });
      });
    });
    applyFilter();
  }
  var curF = 'all';
  function applyFilter(){
    var q = document.getElementById('mSearch').value.trim().toLowerCase();
    var archived = (curF === 'archived');
    var byId = {};
    (archived ? memArch : memAll).forEach(function(m){ byId[m.id] = m; });
    memList.querySelectorAll('.mCard').forEach(function(c){
      var m = byId[c.dataset.id];
      if(!m){ c.classList.add('hid'); return; }
      var okF = archived || curF === 'all' ||
        (curF === 'pinned' && m.pinned) ||
        (curF === 'deep' && m.importance >= 9) ||
        (curF === 'fragment' && isFrag(m));
      var okQ = !q || ((m.name + ' ' + (m.content || '') + ' ' + (m.preview || '')).toLowerCase().indexOf(q) !== -1);
      c.classList.toggle('hid', !(okF && okQ));
    });
  }
  document.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click', function(){
      document.querySelector('.chip.cur').classList.remove('cur');
      ch.classList.add('cur');
      curF = ch.dataset.f;
      if(curF === 'archived' && !archLoaded){
        document.getElementById('memNote').textContent = 'opening the vault…';
        fetch(API + '/memory/buckets?archived=1')
          .then(function(r){ return r.json(); })
          .then(function(d){
            memArch = d.items || []; archLoaded = true;
            document.getElementById('memNote').textContent = 'laid down, not lost';
            renderMems();
          })
          .catch(function(){ say("Can't reach home"); });
      } else {
        if(curF !== 'archived') document.getElementById('memNote').textContent = 'carved by hand — kept for good';
        renderMems();
      }
    });
  });
  document.getElementById('mSearch').addEventListener('input', applyFilter);

  function loadMems(){
    fetch(API + '/memory/buckets')
      .then(function(r){ return r.json(); })
      .then(function(d){
        memAll = d.items || [];
        document.getElementById('memNote').textContent = 'carved by hand — kept for good';
        renderMems();
      })
      .catch(function(){ document.getElementById('memNote').textContent = "can't reach his mind right now"; });
  }

  /* ===== dust: fast river ===== */
  var cv=document.getElementById('dust'), ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var W,H,parts=[];
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/1.5; }

  function build(){
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var r=document.getElementById('disc').getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;
    if(r.width===0){ cx=W/2; cy=H/2; }
    var ang=Math.atan2(0.88,-0.47);
    var dx=Math.cos(ang), dy=Math.sin(ang);
    var L=Math.max(W,H)*0.85;
    var sigma=Math.min(W,H)*0.10;
    parts=[];
    for(var i=0;i<260;i++){
      var t=(Math.random()*2-1)*L;
      var off=gauss()*sigma;
      var big=Math.random()<0.05;
      parts.push({
        t:t, off:off, cx:cx, cy:cy, dx:dx, dy:dy, L:L,
        s: big? 1.6+Math.random()*1.2 : 0.4+Math.random()*0.9,
        a: big? 0.35+Math.random()*0.3 : 0.08+Math.random()*0.25,
        v: 5+Math.random()*7,
        ph: Math.random()*6.28,
        c: Math.random()<0.75 ? '227,216,255' : '157,140,216'
      });
    }
    for(var j=0;j<70;j++){
      parts.push({ fixed:true,
        x: Math.random()*W,
        y: H*0.62 + Math.random()*H*0.26,
        s: 0.5+Math.random()*1.3,
        a: 0.12+Math.random()*0.5,
        ph: Math.random()*6.28,
        c: Math.random()<0.7 ? '227,216,255' : '196,160,255'
      });
    }
  }

  var last=performance.now();
  function tick(now){
    var dt=(now-last)/1000; last=now;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      if(p.fixed){
        var tw2=reduced?1:(0.3+0.7*Math.abs(Math.sin(now*0.0009+p.ph)));
        ctx.globalAlpha=p.a*tw2;
        ctx.fillStyle='rgb('+p.c+')';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill();
        continue;
      }
      if(!reduced){ p.t+=p.v*dt; if(p.t>p.L) p.t=-p.L; }
      var px=p.cx+p.dx*p.t - p.dy*p.off;
      var py=p.cy+p.dy*p.t + p.dx*p.off;
      var twk=reduced?1:(0.75+0.25*Math.sin(now*0.001+p.ph));
      ctx.globalAlpha=p.a*twk;
      ctx.fillStyle='rgb('+p.c+')';
      ctx.beginPath(); ctx.arc(px,py,p.s,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(!reduced) requestAnimationFrame(tick);
  }

  function start(){ build(); last=performance.now();
    if(reduced){ tick(last); } else { requestAnimationFrame(tick); } }
  window.addEventListener('resize',function(){ build(); });
  setTimeout(start,80);

  /* ===== go ===== */
  loadDays();
  loadMems();
</script>
</body>
