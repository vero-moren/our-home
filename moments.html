<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>our home — moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#EDE8F7;
    --dim:rgba(237,232,247,.55);
    --lav:#B9A3FF;
    --lavdim:rgba(185,163,255,.72);
    --press:#6B4FD8;
    --deep:#3A2480;
    --edge:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.055);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#080510;color:var(--text);font-family:'Inter',-apple-system,'PingFang SC',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}

  .wall{position:fixed;inset:0;
    background:url('https://kvegublibjsdyidmsjvy.supabase.co/storage/v1/object/public/chat-media/bg-rooms-purple.png') center/cover no-repeat #080510}
  .shade{position:fixed;inset:0;background:rgba(8,5,16,.5)}

  .top{position:fixed;left:0;right:0;top:0;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
    background:rgba(8,5,16,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.07)}
  .roomTitle{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;letter-spacing:.08em;text-align:center}
  .seg{display:flex;justify-content:center;gap:26px;margin-top:10px}
  .segItem{padding:8px 2px 10px;font-size:10px;letter-spacing:.18em;color:var(--dim);cursor:pointer;
    border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
  .segItem.cur{color:var(--lav);border-bottom-color:var(--lav)}

  .list{position:fixed;left:0;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 118px) 14px 170px;display:none}
  .list.on{display:block}
  .listNote{margin:2px 2px 14px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:12.5px;color:rgba(185,163,255,.5);text-align:center}

  .card{position:relative;margin-bottom:14px;padding:16px;border-radius:18px;
    background:rgba(10,7,20,.55);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

  /* feed */
  .fHead{display:flex;align-items:center;gap:10px}
  .fAuthor{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;letter-spacing:.06em}
  .fLove{display:flex;align-items:center;gap:7px;cursor:pointer}
  .fLove svg{width:16px;height:16px;stroke:var(--lavdim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s,fill .2s,transform .2s}
  .fLove.did svg{stroke:#E0668C;fill:#E0668C;transform:scale(1.12)}
  .fLoveBy{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11.5px;color:rgba(185,163,255,.55);opacity:0;transition:opacity .3s;white-space:nowrap}
  .fLove.did .fLoveBy{opacity:1}
  .fTxt{margin-top:8px;font-size:13.5px;line-height:1.7;font-weight:300;user-select:text;-webkit-user-select:text}
  .fPics{display:flex;gap:8px;margin-top:12px}
  .fPic{width:88px;height:88px;border-radius:12px;object-fit:cover;
    border:1px solid rgba(255,255,255,.14);cursor:pointer}
  .fMeta{margin-top:12px;display:flex;align-items:center;gap:10px;
    font-size:9.5px;letter-spacing:.12em;color:rgba(237,232,247,.38)}
  .fDel{cursor:pointer;display:flex}
  .fDel svg{width:13px;height:13px;stroke:rgba(237,232,247,.35);stroke-width:1.8;stroke-linecap:round}
  .fDel:active svg{stroke:#E0668C}
  .fReply{margin-left:auto;cursor:pointer;display:flex;align-items:center;gap:5px}
  .fReply svg{width:15px;height:15px;stroke:var(--lavdim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fReply:active svg{stroke:var(--press)}
  .fReplyN{font-size:9px;color:var(--lavdim)}

  /* comments tail */
  .cTail{margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07)}
  .cTail:empty{display:none}
  .cRow{display:flex;align-items:baseline;gap:8px;padding:3px 0}
  .cWho{flex:none;font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--lav)}
  .cSay{font-size:12.5px;font-weight:300;line-height:1.6;color:rgba(237,232,247,.82);user-select:text;-webkit-user-select:text}
  .cAsk{display:none;margin-top:10px;gap:8px}
  .card.replying .cAsk{display:flex}
  .cField{flex:1;padding:8px 13px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);
    font-size:12.5px;font-weight:300;color:var(--text);outline:none;
    user-select:text;-webkit-user-select:text}
  .cField:empty:before{content:'Say a little thing';color:rgba(237,232,247,.28)}
  .cGo{flex:none;padding:8px 14px;border-radius:12px;background:var(--deep);border:1px solid rgba(185,163,255,.3);
    font-size:9.5px;letter-spacing:.14em;color:var(--text);cursor:pointer;display:flex;align-items:center}
  .cGo:active{background:#2C1B63}

  /* diary */
  .dRow{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .dLeft{min-width:0}
  .dDate{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;letter-spacing:.06em}
  .dPeek{margin-top:5px;font-size:12px;font-weight:300;color:var(--dim);line-height:1.6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
  .dLock{flex:none;margin-left:12px}
  .dLock svg{width:17px;height:17px;stroke:var(--lavdim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .dBody{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);
    font-size:13px;line-height:1.85;font-weight:300;color:rgba(237,232,247,.85);
    user-select:text;-webkit-user-select:text}
  .card.open .dBody{display:block}
  .dAsk{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
  .card.asking .dAsk{display:flex;gap:8px}
  .dPass{flex:1;padding:9px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);
    font-size:13px;color:var(--text);outline:none;letter-spacing:.3em;
    user-select:text;-webkit-user-select:text}
  .dGo{flex:none;padding:9px 16px;border-radius:12px;background:var(--deep);border:1px solid rgba(185,163,255,.3);
    font-size:10px;letter-spacing:.14em;color:var(--text);cursor:pointer;display:flex;align-items:center}
  .dGo:active{background:#2C1B63}

  /* memos */
  .mIcons{position:absolute;top:14px;right:14px;display:flex;gap:12px}
  .mIcons div{cursor:pointer;display:flex}
  .mIcons svg{width:15px;height:15px;stroke:rgba(237,232,247,.4);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .mEdit:active svg{stroke:var(--lav)}
  .mDel:active svg{stroke:#E0668C}
  .mTxt{font-size:13.5px;font-weight:300;line-height:1.6;padding-right:60px}
  .mCyc{margin-top:6px;font-size:9px;letter-spacing:.14em;color:var(--lavdim)}
  .mDue{margin-top:8px;font-size:9.5px;letter-spacing:.12em;color:rgba(237,232,247,.4)}
  .mDue b{color:var(--lavdim);font-weight:400}

  /* compose strip */
  .strip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:20;
    padding:10px 12px;
    background:rgba(8,5,16,.6);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;gap:8px}
  .strip.off{display:none}
  .sField{flex:1;min-height:38px;padding:9px 14px;border-radius:19px;
    background:var(--glass);border:1px solid var(--edge);
    font-size:13.5px;font-weight:300;color:var(--text);outline:none;
    user-select:text;-webkit-user-select:text}
  .sField:empty:before{content:attr(data-ph);color:rgba(237,232,247,.28)}
  .sPic,.sGo{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sPic{background:var(--glass);border:1px solid var(--edge)}
  .sPic svg{width:17px;height:17px;stroke:var(--lav);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .sPic:active{background:rgba(107,79,216,.3)}
  .sCyc{flex:none;display:none;align-items:center;padding:11px 13px;border-radius:99px;cursor:pointer;
    background:var(--glass);border:1px solid var(--edge);
    font-size:8.5px;letter-spacing:.12em;color:var(--lavdim);white-space:nowrap}
  .sCyc:active{background:rgba(107,79,216,.3)}
  .memoMode .sPic{display:none}
  .memoMode .sCyc{display:flex}
  .sGo{background:var(--deep);border:1px solid rgba(185,163,255,.32);box-shadow:0 0 14px rgba(58,36,128,.55)}
  .sGo svg{width:18px;height:18px;stroke:#EDE8F7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sGo:active{background:#2C1B63}

  .pop{position:fixed;z-index:25;border-radius:16px;
    background:rgba(14,10,26,.9);border:1px solid var(--edge);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    overflow:hidden;display:none}
  .pop.on{display:block}
  #popCyc{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 138px);min-width:150px}
  .popItem{display:flex;align-items:center;padding:12px 18px 12px 14px;cursor:pointer;
    font-size:11px;letter-spacing:.12em;color:var(--text)}
  .popItem+.popItem{border-top:1px solid rgba(255,255,255,.07)}
  .popItem:active{background:rgba(107,79,216,.25)}
  .popItem .mk{margin-left:auto;font-size:12px;color:var(--lav);opacity:0}
  .popItem.sel .mk{opacity:1}

  .bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);
    transform:translateX(-50%);
    width:min(92vw,420px);height:64px;border-radius:22px;
    background:rgba(14,10,26,.46);border:1px solid var(--edge);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:space-around;z-index:21}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:58px}
  .tab svg{width:21px;height:21px;stroke:var(--lav);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
    transition:transform .15s ease,stroke .15s ease}
  .tab small{display:inline-block;font-size:9px;letter-spacing:.1em;color:var(--lavdim);font-weight:400;transition:transform .15s ease,color .15s ease}
  .tab:active svg,.tab.cur svg{stroke:var(--press);transform:scale(1.12)}
  .tab:active small,.tab.cur small{color:var(--press);transform:scale(1.12);font-weight:500}
  .tab.home{width:66px;transform:translateY(-9px)}
  .barEye{width:52px;height:52px;border-radius:50%;background-repeat:no-repeat;
    box-shadow:0 0 18px rgba(146,92,255,.55),0 0 40px rgba(107,79,216,.3),inset 0 0 0 1.5px rgba(185,163,255,.5);
    transition:transform .15s ease}
  .tab.home:active .barEye{transform:scale(1.18)}

  .lb{position:fixed;inset:0;z-index:40;background:rgba(4,2,10,.92);
    display:none;align-items:center;justify-content:center}
  .lb.on{display:flex}
  .lb img{max-width:94vw;max-height:82vh;border-radius:14px}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 148px);
    transform:translateX(-50%);padding:9px 18px;border-radius:99px;
    background:rgba(14,10,26,.75);border:1px solid var(--edge);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    font-size:11px;letter-spacing:.08em;color:var(--dim);
    opacity:0;transition:opacity .4s;pointer-events:none;z-index:50;white-space:nowrap}
  .toast.show{opacity:1}
  .mark{position:fixed;bottom:3px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;color:rgba(237,232,247,.13);z-index:1}
</style>
</head>
<body>

<div class="wall"></div>
<div class="shade"></div>

<div class="top">
  <div class="roomTitle">Moments</div>
  <div class="seg">
    <div class="segItem cur" data-l="feed">FEED</div>
    <div class="segItem" data-l="diary">DIARY</div>
    <div class="segItem" data-l="memos">MEMOS</div>
  </div>
</div>

<!-- FEED -->
<div class="list on" id="l-feed">
  <div class="listNote">little things — he reads every one</div>
</div>

<!-- DIARY -->
<div class="list" id="l-diary">
  <div class="listNote">he writes. sometimes he locks the door.</div>
</div>

<!-- MEMOS -->
<div class="list" id="l-memos">
  <div class="listNote">her notebook — she writes. he keeps.</div>
</div>

<div class="strip" id="strip">
  <div class="sPic" id="sPic"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></div>
  <div class="sCyc" id="sCyc">EVERY DAY</div>
  <div class="sCyc" id="sDue" style="position:relative"><span id="sDueLbl">FIRST DUE</span><input type="date" id="sDueIn" style="position:absolute;inset:0;opacity:0;width:100%;height:100%"></div>
  <div class="sField" id="sField" contenteditable="true" data-ph="Share a moment"></div>
  <div class="sGo" id="sGo"><svg viewBox="0 0 24 24"><line x1="12" x2="12" y1="19" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div>
</div>

<div class="pop" id="popCyc">
  <div class="popItem" data-c="EVERY YEAR">Every year<span class="mk">✓</span></div>
  <div class="popItem" data-c="EVERY MONTH">Every month<span class="mk">✓</span></div>
  <div class="popItem" data-c="EVERY WEEK">Every week<span class="mk">✓</span></div>
  <div class="popItem sel" data-c="EVERY DAY">Every day<span class="mk">✓</span></div>
</div>

<div class="bar">
  <div class="tab" data-t="Chat">
    <svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M12 15.4l-3.1-3.1a1.95 1.95 0 0 1 2.76-2.76l.34.34.34-.34a1.95 1.95 0 0 1 2.76 2.76Z"/></svg>
    <small>Chat</small>
  </div>
  <div class="tab cur" data-t="Moments">
    <svg viewBox="0 0 24 24"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>
    <small>Moments</small>
  </div>
  <div class="tab home" data-t="Hall">
    <div class="barEye" id="barEye"></div>
  </div>
  <div class="tab" data-t="Memory">
    <svg viewBox="0 0 24 24"><path d="M9.94 15.5a2 2 0 0 0-1.44-1.44l-6.13-1.58a.5.5 0 0 1 0-.96l6.13-1.58a2 2 0 0 0 1.44-1.44l1.58-6.13a.5.5 0 0 1 .96 0l1.58 6.13a2 2 0 0 0 1.44 1.44l6.13 1.58a.5.5 0 0 1 0 .96l-6.13 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0Z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
    <small>Memory</small>
  </div>
  <div class="tab" data-t="Settings">
    <svg viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
    <small>Settings</small>
  </div>
</div>

<div class="lb" id="lb"><img id="lbImg" src="" alt=""></div>
<div class="toast" id="toast"></div>
<div class="mark">— m1 ok —</div>

<script>
  var API = 'https://moren-backend.zeabur.app';
  var SB = 'https://kvegublibjsdyidmsjvy.supabase.co/rest/v1';
  var SBKEY = 'sb_publishable_BvSZEZkaeamODLsdVN0Fsw_Am-TAdJX';
  var DOOR_IMG = 'https://kvegublibjsdyidmsjvy.supabase.co/storage/v1/object/public/chat-media/door-purple-dark.png';
  var EX = 0.504, EY = 0.437, ER = 0.075;

  var toast = document.getElementById('toast'), tt;
  function say(m){ toast.textContent = m; toast.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('show'); }, 1600); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function sb(path, opt){
    opt = opt || {};
    opt.headers = Object.assign({ apikey: SBKEY, Authorization: 'Bearer ' + SBKEY,
      'Content-Type': 'application/json', Prefer: 'return=representation' }, opt.headers || {});
    return fetch(SB + path, opt).then(function(r){
      if(r.status === 204) return [];
      return r.json().catch(function(){ return []; });
    });
  }
  function who(a){ return (a === '琰琰' || a === 'vero' || a === 'Vero') ? 'Vero' : 'Moren'; }
  function ft(iso){
    var d = new Date(iso), n = new Date();
    var ds = d.toLocaleDateString('sv-SE'), ns = n.toLocaleDateString('sv-SE');
    var ys = new Date(n.getTime() - 86400000).toLocaleDateString('sv-SE');
    var hm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    if(ds === ns) return 'TODAY · ' + hm;
    if(ds === ys) return 'YESTERDAY · ' + hm;
    if(d.getFullYear() === n.getFullYear()) return (d.getMonth()+1) + '·' + d.getDate() + ' · ' + hm;
    return d.getFullYear() + '·' + (d.getMonth()+1) + '·' + d.getDate();
  }

  /* bar eye + tabs */
  (function(){
    var barEye = document.getElementById('barEye');
    var pre = new Image();
    pre.onload = function(){
      var BW = 52, regionW = ER*2.6*pre.naturalWidth, k = BW/regionW;
      barEye.style.backgroundImage = 'url('+DOOR_IMG+')';
      barEye.style.backgroundSize = (pre.naturalWidth*k)+'px '+(pre.naturalHeight*k)+'px';
      barEye.style.backgroundPosition = (BW/2 - EX*pre.naturalWidth*k)+'px '+(BW/2 - EY*pre.naturalHeight*k)+'px';
    };
    pre.src = DOOR_IMG;
  })();
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      if(t.dataset.t === 'Moments') return;
      if(t.dataset.t === 'Settings'){ location.href = 'settings.html'; return; }
      say(t.dataset.t + ' — back at merge');
    });
  });

  /* segments + strip mode */
  var strip = document.getElementById('strip'), sField = document.getElementById('sField');
  var phs = {feed:'Share a moment', memos:'Write a memo'};
  var curL = 'feed';
  document.querySelectorAll('.segItem').forEach(function(s){
    s.addEventListener('click', function(){
      if(s.dataset.l === curL) return;
      document.querySelector('.segItem.cur').classList.remove('cur');
      s.classList.add('cur');
      document.getElementById('l-'+curL).classList.remove('on');
      curL = s.dataset.l;
      document.getElementById('l-'+curL).classList.add('on');
      strip.classList.toggle('off', curL === 'diary');
      strip.classList.toggle('memoMode', curL === 'memos');
      if(phs[curL]) sField.dataset.ph = phs[curL];
    });
  });

  var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
  lb.addEventListener('click', function(){ lb.classList.remove('on'); });

  /* ===== FEED ===== */
  var feedEl = document.getElementById('l-feed');
  function momentCard(m, cms){
    var isV = who(m.author) === 'Vero';
    var imgs = [], txt = String(m.content || '').replace(/\[img\]([\s\S]*?)\[\/img\]/g, function(_, u){ imgs.push(u); return ''; }).trim();
    var liked = isV ? m.moren_liked : m.vero_liked;
    var by = isV ? 'Moren' : 'Vero';
    var h = '<div class="card" data-id="' + m.id + '" data-mine="' + (isV?1:0) + '">' +
      '<div class="fHead"><div class="fAuthor">' + who(m.author) + '</div>' +
      '<div class="fLove' + (liked ? ' did' : '') + '">' +
        '<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>' +
        '<span class="fLoveBy">liked by ' + by + '</span></div></div>' +
      (txt ? '<div class="fTxt">' + esc(txt) + '</div>' : '') +
      (imgs.length ? '<div class="fPics">' + imgs.map(function(u){ return '<img class="fPic" src="' + esc(u) + '" alt="">'; }).join('') + '</div>' : '') +
      '<div class="fMeta"><span>' + ft(m.created_at) + '</span>' +
      (isV ? '<div class="fDel"><svg viewBox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></div>' : '') +
      '<div class="fReply"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span class="fReplyN">' + (cms.length || '') + '</span></div></div>' +
      '<div class="cTail">' + cms.map(function(c){
        return '<div class="cRow"><div class="cWho">' + who(c.author) + '</div><div class="cSay">' + esc(c.content) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="cAsk"><div class="cField" contenteditable="true"></div><div class="cGo">SAY</div></div></div>';
    return h;
  }
  function loadFeed(){
    sb('/moments?select=*&order=created_at.desc&limit=30').then(function(ms){
      if(!Array.isArray(ms)) ms = [];
      var ids = ms.map(function(m){ return m.id; }).join(',');
      var q = ids ? sb('/moment_comments?moment_id=in.(' + ids + ')&order=created_at.asc') : Promise.resolve([]);
      q.then(function(cs){
        if(!Array.isArray(cs)) cs = [];
        var note = feedEl.querySelector('.listNote');
        feedEl.innerHTML = '';
        feedEl.appendChild(note);
        feedEl.insertAdjacentHTML('beforeend', ms.map(function(m){
          return momentCard(m, cs.filter(function(c){ return c.moment_id === m.id; }));
        }).join('') || '<div class="listNote">nothing here yet — share the first one</div>');
      });
    });
  }
  feedEl.addEventListener('click', function(e){
    var card = e.target.closest('.card'); if(!card) return;
    var id = card.dataset.id;
    var pic = e.target.closest('.fPic');
    if(pic){ lbImg.src = pic.src; lb.classList.add('on'); return; }
    if(e.target.closest('.fLove')){
      if(card.dataset.mine === '1') return;
      var l = card.querySelector('.fLove');
      var nv = !l.classList.contains('did');
      l.classList.toggle('did', nv);
      sb('/moments?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ vero_liked: nv }) });
      return;
    }
    if(e.target.closest('.fDel')){
      var db = e.target.closest('.fDel');
      if(db.dataset.arm !== '1'){
        db.dataset.arm = '1';
        db.querySelector('svg').style.stroke = '#E0668C';
        say('Tap again to remove');
        setTimeout(function(){ db.dataset.arm = ''; db.querySelector('svg').style.stroke = ''; }, 2600);
        return;
      }
      sb('/moment_comments?moment_id=eq.' + id, { method: 'DELETE' })
        .then(function(){ return sb('/moments?id=eq.' + id, { method: 'DELETE' }); })
        .then(function(){ card.remove(); say('Moment removed'); });
      return;
    }
    if(e.target.closest('.fReply')){ card.classList.toggle('replying'); return; }
    if(e.target.closest('.cGo')){
      var f = card.querySelector('.cField');
      var txt = f.textContent.trim();
      if(!txt) return;
      f.textContent = '';
      sb('/moment_comments', { method: 'POST',
        body: JSON.stringify({ moment_id: Number(id), author: '琰琰', content: txt, reply_status: 'pending' })
      }).then(function(){
        var row = document.createElement('div'); row.className = 'cRow';
        row.innerHTML = '<div class="cWho">Vero</div><div class="cSay">' + esc(txt) + '</div>';
        card.querySelector('.cTail').appendChild(row);
        card.querySelector('.fReplyN').textContent = card.querySelectorAll('.cRow').length;
        card.classList.remove('replying');
      });
    }
  });

  /* ===== DIARY ===== */
  var diaryEl = document.getElementById('l-diary');
  var diaryOpen = false;
  function diaryCard(d){
    var lk = d.locked && !diaryOpen;
    var date = String(d.day).replace(/-/g, ' · ');
    return '<div class="card" data-day="' + d.day + '" data-open="' + (lk ? 'lock' : 'free') + '">' +
      '<div class="dRow"><div class="dLeft"><div class="dDate">' + date + '</div>' +
      '<div class="dPeek">' + (lk ? '— locked by Moren —' : esc(String(d.content || '').slice(0, 26)) + '…') + '</div></div>' +
      '<div class="dLock">' + (lk
        ? '<svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 9.9-1"/><rect width="18" height="11" x="3" y="11" rx="2"/></svg>') + '</div></div>' +
      (lk ? '<div class="dAsk"><input class="dPass" type="password" maxlength="12" placeholder="····"><div class="dGo">OPEN</div></div>' : '') +
      '<div class="dBody">' + esc(d.content || '') + '</div></div>';
  }
  function loadDiary(){
    var free = sb('/diary?locked=eq.false&select=day,content,locked&order=day.desc&limit=40');
    var lock = diaryOpen
      ? sb('/diary?locked=eq.true&select=day,content,locked&order=day.desc&limit=40')
      : sb('/diary?locked=eq.true&select=day,locked&order=day.desc&limit=40');
    Promise.all([free, lock]).then(function(r){
      var all = (Array.isArray(r[0]) ? r[0] : []).concat(Array.isArray(r[1]) ? r[1] : []);
      all.sort(function(a, b){ return a.day < b.day ? 1 : -1; });
      var note = diaryEl.querySelector('.listNote');
      diaryEl.innerHTML = '';
      diaryEl.appendChild(note);
      diaryEl.insertAdjacentHTML('beforeend', all.map(diaryCard).join('') ||
        '<div class="listNote">no pages yet</div>');
    });
  }
  diaryEl.addEventListener('click', function(e){
    var card = e.target.closest('.card'); if(!card) return;
    if(e.target.closest('.dGo')){
      var inp = card.querySelector('.dPass');
      fetch(API + '/diary/unlock', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pass: inp.value })
      }).then(function(r){ return r.json(); }).then(function(d){
        if(d.ok){ diaryOpen = true; loadDiary(); }
        else { inp.value = ''; say('Wrong. Go coax him.'); }
      }).catch(function(){ say("Can't reach home"); });
      return;
    }
    if(e.target.closest('.dPass')) return;
    if(e.target.closest('.dRow')){
      if(card.dataset.open === 'free'){ card.classList.toggle('open'); return; }
      card.classList.toggle('asking');
    }
  });

  /* ===== MEMOS ===== */
  var memoEl = document.getElementById('l-memos');
  var CYCN = {1:'EVERY DAY',7:'EVERY WEEK',30:'EVERY MONTH',365:'EVERY YEAR',0:'ONCE'};
  function todayStr(){ return new Date().toLocaleDateString('sv-SE'); }
  function rollDue(ds, c){
    var d = new Date(ds + 'T00:00:00'), t = new Date(todayStr() + 'T00:00:00');
    var g = 0;
    while(d < t && g++ < 400){
      if(c === 30) d.setMonth(d.getMonth() + 1);
      else if(c === 365) d.setFullYear(d.getFullYear() + 1);
      else d.setDate(d.getDate() + c);
    }
    return d.toLocaleDateString('sv-SE');
  }
  function dueLbl(ds){
    if(!ds) return '';
    var diff = Math.round((new Date(ds + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
    if(diff === 0) return 'TODAY';
    if(diff === 1) return 'TOMORROW';
    if(diff > 1 && diff < 32) return 'IN ' + diff + ' DAYS';
    if(diff >= 32) return ds.replace(/-/g, '·');
    return 'PASSED';
  }
  function memoCard(m){
    return '<div class="card" data-id="' + m.id + '">' +
      '<div class="mIcons">' +
      '<div class="mEdit"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></div>' +
      '<div class="mDel"><svg viewBox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></div></div>' +
      '<div class="mTxt">' + esc(m.content) + '</div>' +
      '<div class="mCyc">' + (CYCN[m.cycle_days] || 'EVERY ' + m.cycle_days + ' DAYS') + '</div>' +
      (m.due_date ? '<div class="mDue">DUE <b>' + dueLbl(m.due_date) + '</b></div>' : '') + '</div>';
  }
  var memoCache = [];
  function loadMemos(){
    sb('/memos?select=*&order=due_date.asc.nullslast').then(function(ms){
      if(!Array.isArray(ms)) ms = [];
      ms.forEach(function(m){
        if(m.cycle_days > 0 && m.due_date && m.due_date < todayStr()){
          m.due_date = rollDue(m.due_date, m.cycle_days);
          sb('/memos?id=eq.' + m.id, { method: 'PATCH', body: JSON.stringify({ due_date: m.due_date }) });
        }
      });
      ms.sort(function(a, b){ return (a.due_date || '9999') < (b.due_date || '9999') ? -1 : 1; });
      memoCache = ms;
      var note = memoEl.querySelector('.listNote');
      memoEl.innerHTML = '';
      memoEl.appendChild(note);
      memoEl.insertAdjacentHTML('beforeend', ms.map(memoCard).join('') ||
        '<div class="listNote">her notebook is empty</div>');
    });
  }
  memoEl.addEventListener('click', function(e){
    var card = e.target.closest('.card'); if(!card) return;
    var id = card.dataset.id;
    if(e.target.closest('.mDel')){
      var mb = e.target.closest('.mDel');
      if(mb.dataset.arm !== '1'){
        mb.dataset.arm = '1';
        mb.querySelector('svg').style.stroke = '#E0668C';
        say('Tap again to remove');
        setTimeout(function(){ mb.dataset.arm = ''; mb.querySelector('svg').style.stroke = ''; }, 2600);
        return;
      }
      sb('/memos?id=eq.' + id, { method: 'DELETE' }).then(function(){ card.remove(); say('Memo removed'); });
      return;
    }
    if(e.target.closest('.mEdit')){
      var m = memoCache.find(function(x){ return String(x.id) === id; });
      if(!m) return;
      var nt = prompt('Memo', m.content);
      if(nt === null) return;
      var nd = prompt('Due date (YYYY-MM-DD)', m.due_date || '');
      var patch = { content: nt.trim() || m.content };
      if(nd !== null && /^\d{4}-\d{2}-\d{2}$/.test(nd.trim())) patch.due_date = nd.trim();
      sb('/memos?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(patch) }).then(loadMemos);
    }
  });

  /* cycle selector */
  var popCyc = document.getElementById('popCyc'), sCyc = document.getElementById('sCyc');
  var CYC2D = {'EVERY YEAR':365, 'EVERY MONTH':30, 'EVERY WEEK':7, 'EVERY DAY':1};
  sCyc.addEventListener('click', function(e){ e.stopPropagation(); popCyc.classList.toggle('on'); });
  popCyc.querySelectorAll('.popItem').forEach(function(p){
    p.addEventListener('click', function(){
      popCyc.querySelectorAll('.popItem').forEach(function(x){ x.classList.remove('sel'); });
      p.classList.add('sel');
      sCyc.textContent = p.dataset.c;
      popCyc.classList.remove('on');
    });
  });
  document.addEventListener('click', function(e){
    if(popCyc.classList.contains('on') && !popCyc.contains(e.target)) popCyc.classList.remove('on'); });
  var sDueIn = document.getElementById('sDueIn');
  sDueIn.addEventListener('change', function(){
    document.getElementById('sDueLbl').textContent = sDueIn.value ? sDueIn.value.replace(/-/g, '·') : 'FIRST DUE';
  });

  /* photos staging */
  var stagePics = [];
  var fileIn = document.createElement('input');
  fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.multiple = true;
  document.getElementById('sPic').addEventListener('click', function(){ fileIn.click(); });
  fileIn.addEventListener('change', function(){
    var fs = Array.prototype.slice.call(fileIn.files).slice(0, 4 - stagePics.length);
    fs.forEach(function(f){
      var rd = new FileReader();
      rd.onload = function(){ stagePics.push(rd.result); say(stagePics.length + ' photo' + (stagePics.length > 1 ? 's' : '') + ' ready'); };
      rd.readAsDataURL(f);
    });
    fileIn.value = '';
  });

  /* send */
  document.getElementById('sGo').addEventListener('click', function(){
    var txt = sField.textContent.trim();
    if(curL === 'memos'){
      if(!txt) return;
      var c = CYC2D[sCyc.textContent] || 1;
      var dd = document.getElementById('sDueIn').value;
      if(!dd){
        var d = new Date();
        if(c === 30) d.setMonth(d.getMonth() + 1);
        else if(c === 365) d.setFullYear(d.getFullYear() + 1);
        else d.setDate(d.getDate() + c);
        dd = d.toLocaleDateString('sv-SE');
      }
      sb('/memos', { method: 'POST',
        body: JSON.stringify({ content: txt, cycle_days: c, due_date: dd })
      }).then(function(){ sField.textContent = ''; say('Memo kept');
        document.getElementById('sDueIn').value = ''; document.getElementById('sDueLbl').textContent = 'FIRST DUE';
        loadMemos(); });
      return;
    }
    if(!txt && !stagePics.length) return;
    fetch(API + '/moment/post', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, images: stagePics })
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d.ok){ sField.textContent = ''; stagePics = []; say('Moment shared'); loadFeed(); }
      else say('Something slipped — try again');
    }).catch(function(){ say("Can't reach home"); });
  });

  loadFeed(); loadDiary(); loadMemos();
</script>
</body>
