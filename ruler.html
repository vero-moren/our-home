<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ruler</title>
<style>
html,body{margin:0;height:100%}
body{background:linear-gradient(#7a1b2c,#3a2480)}
#r{position:fixed;left:12px;top:60px;color:#fff;font:14px monospace;line-height:1.8;z-index:9;white-space:pre-wrap}
#b{position:fixed;left:0;right:0;bottom:0;height:6px;background:#0f0}
</style>
</head>
<body>
<div id="r"></div>
<div id="b"></div>
<script>
function m(){
  var v = window.visualViewport;
  document.getElementById('r').textContent =
    'innerH ' + window.innerHeight +
    '\nclientH ' + document.documentElement.clientHeight +
    '\nvvH ' + (v ? Math.round(v.height) : '-') +
    '\nscreenH ' + screen.height +
    '\nstandalone ' + (navigator.standalone === true);
}
m(); addEventListener('resize', m);
if(window.visualViewport) visualViewport.addEventListener('resize', m);
</script>
</body>
</html>
